         <!DOCTYPE html>

            window.close();

</head>
<body bgcolor="yellow">
    <div style="color:green;font-size:50px;">
        <script type="text/javascript">
            function pudelko(rodzaj_m,material_m,kolor_m) 
            {
                this.rodzaj=rodzaj_m;
                this.material=material_m;
                this.kolor=kolor_m;
            } 
            pudelko.prototype.wypisz = function () 
            {
                alert(this.rodzaj + " " + this.material + " " + this.kolor)
            };
            var pudelko1 = new pudelko("pudelko", "karton", "brązowy"); 
            var pudelko2 = new pudelko("pudelko", "plastik", "czarny"); 

            pudelko1.wypisz(); 
            pudelko2.wypisz(); 

            document.write("Moje nazwisko to HORDIIENKO mam numer 4 a obiekt to pudelko"+"<br>");
            document.write("dostęp do pól pudelko1 i pudelko2"+"<br>");
            document.write("czyli wypisanie danych"+"<br>");
            document.write("pudelko pierwsze =>"+" "+pudelko1.rodzaj+" "+pudelko1.material+" "+pudelko1.kolor+"<br>");
            document.write("pudelko drugie  =>"+" "+pudelko2.rodzaj+" "+pudelko2.material+" "+pudelko2.kolor+"<br>");
        </script>
    </div>
    <div style="color:blue;font-size:35px;"><br>
        programowanie obiektowe:<br>
        Słowo kluczowe prototype stosowane jest do:<br>
        dodawania nowych metod (lub właściwości) do już istniejącego konstruktora – dzięki temu wszystkie obiekty<br>
        utworzone tym konstruktorem (np. pudelko1, pudelko2) mają dostęp do tej samej metody wypisz() bez potrzeby<br>
        wpisywania jej w każdym obiekcie osobno. Oszczędza to pamięć i pozwala na wspólną definicję zachowania<br>
        Słowo kluczowe new stosowane jest do:<br>
        tworzenia nowej instancji (nowego obiektu) na podstawie konstruktora, np. new pudelko("pudelko","karton","brązowy")<br>
        – powoduje wywołanie konstruktora, utworzenie nowego obiektu oraz przypisanie do jego pól wartości przekazanych<br>
        w argumentach. Wynik zapisujemy w zmiennej (np. pudelko1, pudelko2)<br>
    </div>
